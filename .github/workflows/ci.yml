# Keep this file's name and identity: snapshot releases are named after its run number
# (tools/release.py), which GitHub resets when a workflow is renamed or recreated, and a
# reset would reuse names that once existed (docs/proposals/release.md).
name: CI
on:
  # Every push runs this workflow, so every commit gets the same checks to require: the
  # `changes` job decides whether the image has to be built at all, and `result` is the
  # one status that sums the rest up (see both, below). A push touching only prose —
  # docs/** and the root *.md, never **.md, since image/files is copied into the image —
  # runs the `docs` check and skips the build, in seconds.
  push:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Build everything from scratch: rebuild the builder and sources images and ignore the package cache"
        type: boolean
        default: false
      release_dry_run:
        description: "On main: run the release job with --dry-run, publishing nothing"
        type: boolean
        default: false
  # A clean build of main every two weeks. Every input here is pinned and every result
  # cached, which is exactly the arrangement in which a build can stop working without any
  # run noticing: a cache hit proves only that the inputs once built. So this run trusts
  # nothing it did not make — the builder is rebuilt from the Debian snapshot, the sources
  # image from upstream's URLs, every package without its cache (`fresh` below) — and
  # publishes the result like any run on main. At 16:00 UTC (18:00 CEST, 17:00 CET),
  # an hour before update-packages.yml opens its pull requests, whose runs then mostly
  # find a warm cache, and so before auto-merge.yml starts at 20:00. The time is also
  # when the cache key's period turns over (.github/actions/build-package), so this is
  # the first run of each period; change the two together.
  schedule:
    - cron: "0 16 1,15 * *"

permissions:
  pull-requests: write

# Every per-arch job runs on a native runner (nothing cross-compiles), chosen once in the
# `&runner` anchor. `needs:` waits for both arches of a job, which costs some wall-clock
# time and saves duplicating every job per arch.
#
# The builder and sources jobs are the only ones that reach the internet. Their images
# (and the image-assembly tools, pushed by the builder job) are tagged by content hash
# (tools/image-tags.sh): an existing tag is pulled, not rebuilt.
jobs:
  # Whether this push changes anything the build reads. `false` only for a push whose
  # every changed file is docs/** or a root *.md, compared with the commit before it (a
  # new branch: with main). Anything it cannot tell — another event, a compare that fails
  # or lists 300 files (the API's cap), no files at all — builds.
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.diff.outputs.build }}
      node_conformance: ${{ steps.diff.outputs.node_conformance }}
    steps:
      - name: Classify the changed files
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          build=true node_conformance=true
          if [ "$EVENT" = push ]; then
            base=$BEFORE
            case "$base" in ''|0000000000000000000000000000000000000000) base=$DEFAULT_BRANCH ;; esac
            if files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$GITHUB_SHA" --jq '.files[].filename'); then
              count=$(printf '%s' "$files" | grep -c . || true)
              echo "$count file(s) changed against $base"
              if [ "$count" -gt 0 ] && [ "$count" -lt 300 ] &&
                 ! printf '%s\n' "$files" | grep -qvE '^(docs/.*|[^/]*\.md)$'; then
                build=false
              fi
              # Node conformance takes most of an hour, so it runs only for a change to
              # what the image is made of (any package, the builder, the assembly and
              # /etc) or to the test itself.
              if [ "$count" -gt 0 ] && [ "$count" -lt 300 ] &&
                 ! printf '%s\n' "$files" | grep -qE '^(packages/|builder/|image/|test/node-conformance\.sh$|test/qemu-lib\.sh$|tools/build-node-e2e\.sh$|\.github/workflows/ci\.yml$)'; then
                node_conformance=false
              fi
            fi
          fi
          [ "$build" = true ] || node_conformance=false
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"
          echo "node_conformance=$node_conformance" | tee -a "$GITHUB_OUTPUT"
          if [ "$build" = false ]; then
            echo "Documentation only: the image build is skipped, \`docs\` checks the change." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The check every commit gets, a documentation-only one included: links between the
  # markdown files resolve. Seconds, and nothing built.
  docs:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: ./test/check-doc-links.sh

  builder:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: &runner ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    permissions:
      contents: read
      packages: write
    strategy: &per-arch
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - &telemetry
        name: Collect Workflow Telemetry
        uses: fwilhe2/workflow-telemetry-action@787d6e6911130a9858caf1b54e443b1bd438b383 # v3.2.0
        with:
          # Not mermaid: the run page concatenates every job's summary and renders
          # each mermaid block in its own iframe, hundreds of them.
          charts: sparkline

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - run: ./tools/prep.sh --push builder
        env:
          # Only here and in the sources job, never workflow-wide: build.sh calls prep.sh
          # too, and every package job rebuilding the builder for itself is not the point.
          FRESH: &fresh-env ${{ (github.event_name == 'schedule' || inputs.fresh == true) && '1' || '' }}

      # The image-assembly tools, the other half of what snapshot.debian.org is asked for:
      # pushed here so the rootfs and reproducible jobs pull them rather than each running
      # apt against the snapshot, which answers 503 often enough to fail a run.
      - run: ./tools/prep.sh --push assembler
        env:
          FRESH: *fresh-env

  # Once for both architectures: the tarballs are the same bytes either way.
  sources:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      packages: ${{ steps.packages.outputs.json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *telemetry

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - run: ./tools/prep.sh --push sources
        env:
          FRESH: *fresh-env

      # The build matrix, as JSON.
      - name: List the packages the build matrix compiles
        id: packages
        run: |
          source tools/lib.sh
          for pkg in $(all_packages); do
              if [ -z "$(env_get "$pkg" NO_SYSROOT)" ]; then echo "$pkg"; fi
          done | jq -Rnc '[inputs]' | sed 's/^/json=/' >> "$GITHUB_OUTPUT"

  # Everything else compiles against this glibc. The kernel links no libc, so it runs
  # alongside.
  glibc:
    runs-on: *runner
    permissions:
      contents: read
      packages: read
    needs:
      - builder
      - sources
    strategy: *per-arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *telemetry

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - uses: ./.github/actions/build-package
        with:
          package: glibc
          arch: ${{ matrix.arch }}
          fresh: &fresh ${{ (github.event_name == 'schedule' || inputs.fresh == true) && 'true' || 'false' }}

  kernel:
    runs-on: *runner
    permissions:
      contents: read
      packages: read
      actions: read # main's kernel artifact, for the config report
      pull-requests: write # posting that report on the branch's pull request
    needs:
      - builder
      - sources
    strategy: *per-arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *telemetry

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - uses: ./.github/actions/build-package
        with:
          package: kernel
          arch: ${{ matrix.arch }}
          fresh: *fresh

      - &setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: python/.python-version
          cache: pip
          cache-dependency-path: python/requirements.txt

      # What this kernel builds in that main's last green one does not, and the reverse,
      # posted on the pull request: a new `default y` driver arrives with a bump and
      # fails nothing. A report, never a failure. Only when the kernel was compiled,
      # since it needs the source tree.
      - name: Report the kernel config against main
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          src=$(find packages/kernel -mindepth 1 -maxdepth 1 -type d -name 'linux-*' | head -1)
          if [ -z "$src" ]; then
            echo "kernel came from the cache, nothing new to report" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          main_run=$(gh run list --workflow ci.yml --branch main --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$main_run" ] || ! gh run download "$main_run" -n "package-kernel-$ARCH" -D baseline; then
            echo "no kernel artifact from a green run on main to compare against" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tar xf baseline/kernel.tar -C baseline
          ./test/kernel-config-diff.py baseline/rootfs/boot/config rootfs/boot/config "$src" > config.diff
          if [ ! -s config.diff ]; then
            echo "kernel config ($ARCH): same as main" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          report=$(printf '%s\n' \
            "Kernel config ($ARCH) against main's last green build (run $main_run): what this kernel builds in (+) and no longer does (-)." \
            '' '```diff' "$(cat config.diff)" '```' '' \
            'A driver a VM never needs goes in `vm.config` in `packages/kernel/build.sh`, pushed to this branch. Run: '"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          echo "$report" >> "$GITHUB_STEP_SUMMARY"
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json url --jq '.[0].url // empty')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "$report"
          fi

  # Both arches' kernels against each other (test/kernel-parity.py): a feature userspace
  # sees is the same on amd64 and arm64. Its own job because it needs both artifacts.
  kernel-parity:
    runs-on: ubuntu-26.04
    needs:
      - kernel
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-kernel-amd64
          path: artifacts/amd64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-kernel-arm64
          path: artifacts/arm64

      - *setup-python

      - name: Compare the amd64 and arm64 kernel configs
        run: |
          for a in amd64 arm64; do tar xf artifacts/$a/kernel.tar -C artifacts/$a; done
          ./test/kernel-parity.py artifacts/amd64/rootfs artifacts/arm64/rootfs

  build:
    runs-on: *runner
    permissions:
      contents: read
      packages: read
    needs:
      - glibc
      - sources

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        # Every package except glibc and the kernel, listed by the sources job.
        package: ${{ fromJSON(needs.sources.outputs.packages) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect Workflow Telemetry
        uses: fwilhe2/workflow-telemetry-action@787d6e6911130a9858caf1b54e443b1bd438b383 # v3.2.0
        with:
          charts: sparkline # see the builder job
          # Most of these jobs are cache hits of a few seconds, where a process
          # trace costs a third of the job and a summary says nothing.
          proc_trace_enable: false
          job_summary: false

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - uses: ./.github/actions/build-package
        with:
          package: ${{ matrix.package }}
          arch: ${{ matrix.arch }}
          fresh: *fresh

  rootfs:
    runs-on: *runner
    # actions: read for size-history.py and image-diff.py, which read earlier runs'
    # artifacts; pull-requests: write for telemetry and image-diff.py's comment. Naming a
    # block replaces the workflow default.
    permissions:
      contents: read
      actions: read
      packages: read
      pull-requests: write
    needs:
      - build
      - kernel
    strategy: *per-arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *telemetry

      # For the assembly tools the builder job pushed (tools/prep.sh assembler).
      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*-${{ matrix.arch }}
          path: artifacts

      # Each artifact into staging/<pkg>/, as a local build leaves it, then the same merge.
      - &unpack-packages
        name: Unpack the packages
        run: |
          # -p: modes as packaged.
          find artifacts -name '*.tar' | sort | while read -r t; do
              mkdir -p "staging/$(basename "$t" .tar)"
              tar xpf "$t" -C "staging/$(basename "$t" .tar)"
          done
          ./tools/merge-staging.sh

      # The library checks, the size reports and the SBOM check are Python, run in
      # python/'s venv on the 3.12 baseline (python/README.md).
      - *setup-python

      # Static checks; each is cheaper than finding the same thing in qemu.
      - name: Check for unresolved library dependencies
        run: ./test/check-rootfs-deps.py rootfs

      - name: Check for unsatisfied symbol versions
        run: ./test/check-symbol-versions.py rootfs

      - name: Check every symbol resolves
        run: ./test/check-symbol-resolution.py rootfs

      - name: Check the kernel can run containers
        run: ./test/kernel-caps.py rootfs

      # The same library checks for each extension merged over the base, as a guest sees it.
      - name: Check the extensions' libraries against the base
        run: |
          for ext in extensions/*/; do
              [ -d "$ext/usr" ] || continue
              merged="merged-$(basename "$ext")"
              cp -a rootfs "$merged"
              cp -a --remove-destination "$ext/usr/." "$merged/usr/"
              ./test/check-rootfs-deps.py "$merged"
              ./test/check-symbol-versions.py "$merged"
              ./test/check-symbol-resolution.py "$merged"
              rm -rf "$merged"
          done

      # On main, the image carries the name it may be released under, as IMAGE_VERSION
      # (tools/release.py name); a branch's image is not a release of anything. The
      # reproducible job assembles with the same name.
      - name: Create disk and OCI images
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
              KAETZLI_VERSION=$(./tools/release.py name)
              export KAETZLI_VERSION
              echo "snapshot name: $KAETZLI_VERSION"
          fi
          ./tools/build-image.sh --image-only

      # What must and must not be in each image (test/image-files/), from the manifests the
      # assembly writes: a trim line or a disabled feature that quietly stopped applying.
      - name: Check what the images contain
        run: ./test/check-image-files.sh

      # What the container flavour leaves out of the disk image, by area, and the deps
      # check on its own layer that shows nothing left needs what went: the OCI
      # subtractions, reviewable from the run page. Text in the summary, never mermaid.
      - name: Report what the OCI image leaves out
        run: |
          rc=0
          ./test/oci-trim.py > oci-trim.txt 2>&1 || rc=$?
          cat oci-trim.txt
          { echo "### OCI against the disk image (${{ matrix.arch }})"; echo '```'; cat oci-trim.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Run the OCI image
        run: KAETZLI_BUILD="$GITHUB_SHA" ./test/oci.sh output/kaetzli-oci.tar

      # Binaries built by the runner's gcc, g++, rustc and go: libgcc_s, libstdc++ and
      # zoneinfo, which nothing compiled here asks for.
      - name: Run binaries built elsewhere
        run: |
          ./test/prebuilt.sh build output/prebuilt
          ./test/prebuilt.sh oci output/prebuilt output/kaetzli-oci.tar

      # The same bytes, for the boot job to run in the guest.
      - name: Upload binaries built elsewhere
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt-${{ matrix.arch }}
          path: output/prebuilt

      # Read back by size-history.py in later runs.
      - name: Upload size reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rootfs-size-${{ matrix.arch }}
          path: |
            output/rootfs-size-*.txt
            output/rootfs-files-*.txt

      - name: Check the SBOM
        run: ./test/check-sbom.py

      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: output/sbom-*.json

      # Size checks last, after the uploads, so a failure still leaves everything to look
      # at; `always()` so one overage does not hide the others.
      - name: Measure the disk image
        run: ./test/rootfs-size.py erofs

      - name: Measure the OCI image
        if: always()
        run: ./test/rootfs-size.py oci

      - name: Compare the OCI image against debian-slim
        if: always()
        run: ARCH=${{ matrix.arch }} ./test/vs-debian-slim.py

      # The trend over the last builds on main. Telemetry, so it never fails the job.
      - name: Image size over time
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./test/size-history.py ${{ matrix.arch }}

      # What this build changes against main's newest green one: package versions from
      # the SBOMs, paths from the manifests, size per flavour (test/image-diff.py). On a
      # pull request it keeps one comment per arch current. Telemetry, never a failure.
      - name: Image changes against main
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./test/image-diff.py --arch ${{ matrix.arch }} --comment

      - name: Upload rootfs.erofs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rootfs.erofs-${{ matrix.arch }}
          # The image and the command line carrying its root hash: neither boots alone.
          path: |
            output/rootfs.erofs
            output/rootfs.cmdline

      - name: Upload OCI image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-image-${{ matrix.arch }}
          path: output/kaetzli-oci.tar

      - name: Upload system extensions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extensions-${{ matrix.arch }}
          path: |
            output/extensions
            output/confexts

      # What tools/fetch-image.sh checks a download against before installing it: this
      # run, its commit and arch, and the SHA-256 of every file in the three artifacts a
      # boot needs, by artifact name and path inside it (the format is in that script).
      # The kernel is the package artifact this job downloaded, the one fetch takes too.
      - name: Write the boot bundle's manifest
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          entry() { echo "sha256 $(sha256sum "$1" | cut -d' ' -f1) $2"; }
          {
            echo "# kaetzli boot bundle; tools/fetch-image.sh verifies downloads against it"
            echo "run $GITHUB_RUN_ID"
            echo "commit $GITHUB_SHA"
            echo "arch $ARCH"
            entry output/rootfs.erofs "rootfs.erofs-$ARCH/rootfs.erofs"
            entry output/rootfs.cmdline "rootfs.erofs-$ARCH/rootfs.cmdline"
            entry "artifacts/package-kernel-$ARCH/kernel.tar" "package-kernel-$ARCH/kernel.tar"
            find output/extensions output/confexts -type f | LC_ALL=C sort | while read -r f; do
              entry "$f" "extensions-$ARCH/${f#output/}"
            done
          } > output/bundle.txt
          cat output/bundle.txt

      - name: Upload the boot bundle's manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.arch }}
          path: output/bundle.txt

  # Assemble the images a second time and require the same bytes.
  reproducible:
    runs-on: *runner
    permissions:
      contents: read
      packages: read
      pull-requests: write
    needs:
      - rootfs
    strategy: *per-arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *telemetry

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*-${{ matrix.arch }}
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootfs.erofs-${{ matrix.arch }}
          path: output

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci-image-${{ matrix.arch }}
          path: output

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extensions-${{ matrix.arch }}
          path: output

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: output

      - *unpack-packages

      - *setup-python

      - name: Check the images are reproducible
        run: |
          outputs="output/rootfs.erofs output/rootfs.cmdline output/kaetzli-oci.tar output/sbom-erofs.json output/sbom-oci.json"
          outputs+=" $(ls output/extensions/*.raw output/confexts/*.raw)"
          sha256sum $outputs > first.sha256
          # The same name the rootfs job assembled with: it is in os-release.
          if [ "$GITHUB_REF" = refs/heads/main ]; then
              KAETZLI_VERSION=$(./tools/release.py name)
              export KAETZLI_VERSION
          fi
          ./tools/build-image.sh --image-only > second-build.log 2>&1 || { tail -50 second-build.log; exit 1; }
          sha256sum --check first.sha256

  boot:
    runs-on: *runner
    # actions: read for boot-time-history.py, which reads earlier runs' artifacts.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    needs:
      - rootfs
    strategy: *per-arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *telemetry

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootfs.erofs-${{ matrix.arch }}
          path: artifacts

      # Next to the image, where test/qemu-lib.sh looks for SYSEXTS.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extensions-${{ matrix.arch }}
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-kernel-${{ matrix.arch }}
          path: artifacts

      - run: tar xf artifacts/kernel.tar

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prebuilt-${{ matrix.arch }}
          path: artifacts/prebuilt

      # qemu-system-arm is the package with qemu-system-aarch64. virtiofsd, socat and
      # vhost_vsock are test/vmm.sh's, which skips what the host cannot provide.
      - name: Install qemu
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = arm64 ]; then
            sudo apt-get install -y --no-install-recommends qemu-system-arm ipxe-qemu qemu-efi-aarch64
          else
            sudo apt-get install -y --no-install-recommends qemu-system-x86
          fi
          sudo apt-get install -y --no-install-recommends virtiofsd socat
          sudo modprobe vhost_vsock && sudo chmod 666 /dev/vhost-vsock || true

      # KVM where the runner has it, as the k8s job does: every boot here is several
      # times faster than under TCG, and test/systemd.py's boot time means something
      # (it records which it ran on, and boot-time-history.py compares like with like).
      - name: Open /dev/kvm to the runner user
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "no /dev/kvm: the boots run under TCG"
          fi

      # The Python boot tests run in python/'s venv (kaetzli.qemu).
      - *setup-python

      - name: Boot the image
        run: ./test/boot.py artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check that dm-verity refuses a tampered image
        run: ./test/verity.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check for failed units, and say hello
        run: ./test/systemd.py artifacts/rootfs.erofs rootfs/boot/bzImage

      # Read back by boot-time-history.py in later runs.
      - name: Upload the boot time
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-time-${{ matrix.arch }}
          path: output/boot-time.txt

      # The trend over the last builds on main. Telemetry, so it never fails the job.
      - name: Boot time over time
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./test/boot-time-history.py ${{ matrix.arch }}

      - name: Check networking
        run: ./test/network.py artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check what listens on the network
        run: ./test/listeners.py artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check ssh, and binaries built elsewhere
        run: PREBUILT=artifacts/prebuilt ./test/ssh.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check containers
        run: ./test/container.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check podman
        run: ./test/podman.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check rootless containers
        run: ./test/rootless.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check a persistent /var
        run: ./test/persistent-var.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check the debug extension
        run: ./test/debug.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check system extensions
        run: ./test/sysext.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Check Firecracker- and Virtualization.framework-shaped boots
        run: ./test/vmm.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Upload console log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-console-log-${{ matrix.arch }}
          path: output/*.log

  # grind from main, which turns the CVE reports into a workbook (test/cve-workbook.sh).
  # Builds alongside the image. Gates nothing.
  grind:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: *runner
    continue-on-error: true
    permissions:
      contents: read
    strategy: *per-arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fwilhe2/grind

      - name: Build grind
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --locked --release --no-default-features -p grind-cli

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grind-${{ matrix.arch }}
          path: target/release/grind
          if-no-files-found: error

  # Known vulnerabilities in what this build ships (test/cve-scan.py), and how the count
  # has moved over the last builds on main (test/cve-history.py). Observing only: nothing
  # waits on it, and it cannot fail the run.
  cve-scan:
    runs-on: *runner
    needs:
      - rootfs
      - grind
    # Without grind the scan still runs, and the workbook step ends in a note.
    if: ${{ !cancelled() && needs.rootfs.result == 'success' }}
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    strategy: *per-arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # cve-history.py labels each step by the commits between builds

      # The CVE reports are Python, run in python/'s venv (python/README.md).
      - *setup-python

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: output

      - name: Scan the SBOMs
        env:
          GRYPE_PINNED: 1
        run: ./test/cve-scan.py output

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: grind-${{ matrix.arch }}
          path: grind

      - name: The reports as a workbook
        run: |
          if [ -f grind/grind ]; then
            chmod +x grind/grind # an artifact does not keep the mode
            export GRIND=$PWD/grind/grind
          fi
          ./test/cve-workbook.sh output

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cve-${{ matrix.arch }}
          path: |
            output/cve-summary.txt
            output/cve/*.json
            output/cve.ods

      - name: CVE count over the last builds on main
        env:
          GH_TOKEN: ${{ github.token }}
          GRYPE_PINNED: 1
        run: ./test/cve-history.py ${{ matrix.arch }}

  # A three-node kubeadm cluster (test/k8s.sh). Its own job because it needs KVM (it
  # skips without), and nothing waits on it, since it depends on registry.k8s.io.
  k8s:
    runs-on: *runner
    needs:
      - rootfs
    strategy: *per-arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *telemetry

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootfs.erofs-${{ matrix.arch }}
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extensions-${{ matrix.arch }}
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-kernel-${{ matrix.arch }}
          path: artifacts

      - run: tar xf artifacts/kernel.tar

      - name: Install qemu, and open /dev/kvm to the runner user
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = arm64 ]; then
            sudo apt-get install -y --no-install-recommends qemu-system-arm ipxe-qemu qemu-efi-aarch64
          else
            sudo apt-get install -y --no-install-recommends qemu-system-x86
          fi
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Check a Kubernetes cluster
        run: ./test/k8s.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Upload console logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k8s-console-log-${{ matrix.arch }}
          path: output/*.log
          if-no-files-found: ignore

  # Kubernetes node conformance (test/node-conformance.sh): upstream's node e2e suite,
  # [NodeConformance] specs, on one node with the kubernetes extension. Like k8s, it needs
  # KVM (it skips without) and registry.k8s.io, so nothing waits on it. Failed specs are
  # annotations and in the job summary; the suite's output and results are an artifact.
  # It takes most of an hour, so only a push that changes the image runs it (`changes`);
  # the scheduled and manual runs always do.
  node-conformance:
    runs-on: *runner
    needs:
      - changes
      - rootfs
    if: needs.changes.outputs.node_conformance == 'true'
    strategy: *per-arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *telemetry

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rootfs.erofs-${{ matrix.arch }}
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extensions-${{ matrix.arch }}
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-kernel-${{ matrix.arch }}
          path: artifacts

      - run: tar xf artifacts/kernel.tar

      - name: Install qemu, and open /dev/kvm to the runner user
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = arm64 ]; then
            sudo apt-get install -y --no-install-recommends qemu-system-arm ipxe-qemu qemu-efi-aarch64
          else
            sudo apt-get install -y --no-install-recommends qemu-system-x86
          fi
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      # The suite takes minutes to compile and changes only with the Kubernetes version.
      - name: Restore the node e2e suite
        id: suite
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/node-e2e/${{ matrix.arch }}
          key: node-e2e-${{ matrix.arch }}-${{ hashFiles('packages/kubernetes/env.sh', 'tools/build-node-e2e.sh') }}

      - name: Check node conformance
        run: ./test/node-conformance.sh artifacts/rootfs.erofs rootfs/boot/bzImage

      - name: Save the node e2e suite
        if: always() && steps.suite.outputs.cache-hit != 'true' && hashFiles(format('output/node-e2e/{0}/VERSION', matrix.arch)) != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/node-e2e/${{ matrix.arch }}
          key: ${{ steps.suite.outputs.cache-primary-key }}

      - name: Upload the suite's output and console log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-conformance-${{ matrix.arch }}
          path: |
            output/node-conformance/
            output/node-conformance-console.log
          if-no-files-found: ignore

  # The one status to require in branch protection: whatever this push needed passed.
  # The per-job, per-arch checks come and go with the matrix and are skipped for
  # documentation, and a skipped job satisfies a required check, so requiring them would
  # be both brittle and vacuous. This fails if any job it names failed or was cancelled,
  # and passes when the build was skipped by `changes` and `docs` passed. k8s and
  # node-conformance gate nothing, as before; publish-oci is a deployment, not a check.
  result:
    runs-on: ubuntu-26.04
    if: always()
    needs:
      - changes
      - docs
      - builder
      - sources
      - glibc
      - kernel
      - kernel-parity
      - build
      - rootfs
      - reproducible
      - boot
      - release
    permissions: {}
    steps:
      # release is here for its dry run: a branch that breaks what main's release job
      # needs fails here, not on main. Its cancellation is not a failure: on main a newer
      # run's release replaces a pending one (its concurrency group), which is the design.
      - name: Sum up the jobs this push needed
        env:
          RESULTS: ${{ toJSON(needs) }}
          BUILD: ${{ needs.changes.outputs.build }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "failure" or (.value.result == "cancelled" and .key != "release")) | .key')
          if [ -n "$bad" ]; then
            echo "failed: $(echo $bad)" >&2
            exit 1
          fi
          # A build that was wanted has to have run, not merely not failed.
          if [ "$BUILD" = true ] && [ "$(echo "$RESULTS" | jq -r '.boot.result')" != success ]; then
            echo "the build was needed, and boot did not succeed" >&2
            exit 1
          fi
          [ "$(echo "$RESULTS" | jq -r '.changes.result')" = success ] || { echo "changes did not run" >&2; exit 1; }

  # Both architectures as one manifest list, so one job once both exist. After boot: the
  # OCI image is the same userspace as the disk. Only on main, because `latest` has one
  # holder.
  publish-oci:
    runs-on: ubuntu-26.04
    needs:
      - boot
      - reproducible
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      # Signed attestations (actions/attest): an OIDC token for Sigstore's certificate,
      # and the API that keeps them.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tools/publish-oci.sh reads artifacts/oci-image-<arch>/kaetzli-oci.tar; the SBOMs
      # and bundle manifests are what the attestations below are made of.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{oci-image,sbom,bundle}-*'
          path: artifacts

      - name: Log in to ghcr.io
        run: podman login ghcr.io -u '${{ github.actor }}' -p '${{ secrets.GITHUB_TOKEN }}'

      - run: DIGESTS=output/oci-digests.txt ./tools/publish-oci.sh

      # What gets a provenance attestation: each image pushed and the list, by digest, and
      # every file of each arch's boot bundle — the disk image, its command line, the
      # kernel's package, the extensions — by the SHA-256 its bundle.txt lists, plus each
      # bundle.txt itself, which tools/fetch-image.sh verifies. Checksums, so nothing is
      # downloaded again; `gh attestation verify <file> -R fwilhe2/kaetzli` on any of
      # them proves this workflow built it from this commit.
      - name: List the subjects
        id: subjects
        run: |
          {
              cat output/oci-digests.txt
              for b in artifacts/bundle-*/bundle.txt; do
                  awk '$1 == "sha256" { print $2 "  " $3 }' "$b"
                  sha256sum "$b" | awk -v n="$(basename "$(dirname "$b")")/bundle.txt" '{ print $1 "  " n }'
              done
          } > output/attest-subjects.txt
          cat output/attest-subjects.txt
          image=ghcr.io/fwilhe2/kaetzli/kaetzli
          echo "image=$image" >> "$GITHUB_OUTPUT"
          for arch in amd64 arm64; do
              digest=$(awk -v ref="$image:${GITHUB_SHA::12}-$arch" '$2 == ref { print $1 }' output/oci-digests.txt)
              [ -n "$digest" ] || { echo "no digest for $image:${GITHUB_SHA::12}-$arch" >&2; exit 1; }
              echo "$arch=sha256:$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: output/attest-subjects.txt

      # The SBOM of the OCI flavour, bound to the image it describes.
      - name: Attest the SBOM (amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.subjects.outputs.image }}
          subject-digest: ${{ steps.subjects.outputs.amd64 }}
          sbom-path: artifacts/sbom-amd64/sbom-oci.json

      - name: Attest the SBOM (arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.subjects.outputs.image }}
          subject-digest: ${{ steps.subjects.outputs.arm64 }}
          sbom-path: artifacts/sbom-arm64/sbom-oci.json

  # A green build of main as a GitHub release (tools/release.py; docs/proposals/release.md):
  # the boot assets, extensions, SBOMs, VEX and CVE workbook of both arches under the
  # stable releases/latest/download/ URLs. The script decides whether this run publishes
  # at all — its commit still what main builds, newer than the latest snapshot — since a
  # run can finish after a later push. Not `on: push` alone: auto-merge's commits arrive
  # by workflow_dispatch (pushes with GITHUB_TOKEN start no workflow).
  #
  # Everywhere but main, and on main when dispatched with release_dry_run, the same job
  # with --dry-run: every read and the whole collection, no write. That is how a branch
  # finds out it broke the release before main does, and why `result` needs this job.
  #
  # One release at a time on main (the group), and never a branch's dry run in that
  # group. GitHub keeps one pending job per group and cancels the one it replaces; that
  # one's commit is older than the replacement's, so it would have skipped anyway.
  release:
    runs-on: ubuntu-26.04
    needs:
      - boot
      - reproducible
      # Waited for, for its workbook, not required: it gates nothing, and the notes say
      # when the workbook is missing.
      - cve-scan
    if: ${{ !cancelled() && needs.boot.result == 'success' && needs.reproducible.result == 'success' }}
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'release' || format('release-dry-run-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: write # the release, and listing drafts (a retry replaces its own)
      packages: read # the builder and sources images' digests, for the notes
      id-token: write # the assets' attestation (actions/attest)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - *setup-python

      # Each artifact into artifacts/<name>/, as `gh run download -D artifacts` leaves them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rootfs.erofs-*
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-kernel-*
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: extensions-*
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: cve-*
          path: artifacts

      - name: Publish the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ (github.ref != 'refs/heads/main' || inputs.release_dry_run == true) && '--dry-run' || '' }}
        run: ./tools/release.py publish $DRY_RUN

      # Every asset's provenance, by the checksum SHA256SUMS lists, and SHA256SUMS' own:
      # tools/fetch-image.sh requires it when gh can check it. Only for a snapshot this run
      # published; a skipped run leaves no SHA256SUMS. After publishing, since the assets
      # are known only then: a fetch in the seconds between sees none yet.
      - name: List what to attest
        id: attest
        if: github.ref == 'refs/heads/main' && inputs.release_dry_run != true && hashFiles('output/release/SHA256SUMS') != ''
        run: |
          { cat output/release/SHA256SUMS; (cd output/release && sha256sum SHA256SUMS); } > output/attest-release.txt
          echo "subjects=output/attest-release.txt" >> "$GITHUB_OUTPUT"

      - name: Attest the assets
        if: steps.attest.outputs.subjects != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.attest.outputs.subjects }}
