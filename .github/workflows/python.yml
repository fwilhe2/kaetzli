name: Python

# python/: the kaetzli package behind the Python scripts in test/ and tools/, its tests
# and its lint. Its own workflow, like selftest.yml: it needs nothing built, and a broken
# report should be answered in seconds. It runs on Python 3.12, the baseline, and on the
# newest release, and on the baseline the lock must be what requirements.in compiles to,
# so a dependency change without python/lock.sh fails here rather than on someone's
# machine. No uv (CLAUDE.md, Host-side code): the venv is python3 -m venv and pip.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.x"]
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history tests ask git about this repository's commits

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Make the venv
        run: python3 launch.py

      # What python/lock.sh does, without the container: compile requirements.in with the
      # pinned pip-tools, keeping every pin, and require the committed file back.
      - name: Lock is current
        if: matrix.python == '3.12'
        run: |
          python3 launch.py piptools compile requirements.in
          git diff --exit-code requirements.txt

      # ../image/*.py: what the assembly container runs on its own python3, stdlib only,
      # outside the package but held to its rules (CLAUDE.md, Host-side code).
      - name: Lint
        run: |
          python3 launch.py ruff check . ../image/*.py
          python3 launch.py ruff format --check . ../image/*.py

      - name: Tests
        run: python3 launch.py pytest
