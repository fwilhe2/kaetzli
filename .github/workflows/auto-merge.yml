name: Auto-merge updates

# Merges the green pull requests update-packages.yml opens; tools/auto-merge.py says what
# green means. The updater runs at 17:07 UTC and this once an hour from 20:17 to 04:17
# UTC: the hours between are the time to look and label `hold`, and a mistake that gets
# through is a revert. Several slots because GitHub starts scheduled runs late, by hours
# around midnight; the ones after the first find nothing left to do.
on:
  schedule:
    - cron: "17 20,21,22,23,0,1,2,3,4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Shared with update-packages.yml. Both push update/ branches and dispatch CI on them,
# and a pull request the updater is still waiting on must not be judged half-finished.
concurrency:
  group: package-updates
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-26.04
    permissions:
      contents: write # merge into main
      pull-requests: write # merge the pull request
      actions: write # dispatch ci.yml on main afterwards
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: python/.python-version
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Merge green updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/auto-merge.py
