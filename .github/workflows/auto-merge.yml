name: Auto-merge updates

# Merges the pull requests update-packages.yml opens, once each has passed CI on top of
# the current main. tools/auto-merge.sh is the policy and explains it; this file is only
# when it runs and with what permissions.
#
# Nothing here may happen during European business hours. The updater runs at 17:07 UTC
# and this from 20:00 to 05:00 UTC the same night, so a pull request opened in the
# evening is merged that night if its CI is green: the hours between are the time to
# look at it and label it `hold`, and a mistake that gets through is a revert. There is
# no minimum age. tools/auto-merge.sh enforces the window itself, and that green means
# CI's own check passed on the exact commit that lands. GitHub enforces the last part too:
# the ruleset "main: CI green before a push" refuses a push to main of a commit without a
# successful `result` check from GitHub Actions. Repository admins bypass it, which is how
# a human pushes a docs change; this workflow's token does not.
#
# One cron line is not enough, because GitHub starts scheduled runs late, and late by
# hours around midnight UTC: the single 00:30 slot this used to have started at 04:57 and
# 05:06, outside what was then a 22:00–03:00 window, so every night ended in "the rest
# waits for tomorrow night" at seven in the morning in Germany. So it is tried once an
# hour across the window, off the full hour where the queue is longest. A run with nothing to do takes seconds, the
# concurrency group below keeps them from overlapping, and whichever starts inside the
# window does the work; the ones after find nothing left.
on:
  schedule:
    - cron: "17 20,21,22,23,0,1,2,3,4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Shared with update-packages.yml. Both push update/ branches and dispatch CI on them,
# and a pull request the updater is still waiting on must not be judged half-finished.
concurrency:
  group: package-updates
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-26.04
    permissions:
      contents: write # rebase update/ branches, fast-forward main
      pull-requests: write # comment the CI run on a rebased pull request
      actions: write # dispatch ci.yml on the rebased branch, and on main afterwards
      checks: write # report that run on the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the rebase and the ancestry checks need history

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: python/.python-version
          cache: pip
          cache-dependency-path: python/requirements.txt

      # The Python port in the shadow of the bash version it replaces: both say what they
      # would do, on the same pull requests a moment before the bash version acts, and a
      # difference is a warning with the diff in the summary. Never a failure of this run,
      # and never an action: tools/auto-merge.sh merges until the two have agreed for a
      # while (docs/proposals/host-scripting.md, item 6). Then this step goes, and the
      # next one runs tools/auto-merge.py.
      - name: Shadow the Python port (dry run, both versions)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/auto-merge.sh -n > bash.txt 2>&1 || echo "exit $?" >> bash.txt
          ./tools/auto-merge.py -n > python.txt 2>&1 || echo "exit $?" >> python.txt
          if diff -u bash.txt python.txt > shadow.diff; then
            echo "auto-merge shadow: \`auto-merge.py -n\` said what \`auto-merge.sh -n\` said ($(wc -l < bash.txt) lines)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::auto-merge.py -n differs from auto-merge.sh -n; the diff is in the job summary"
            { echo 'auto-merge shadow: the dry runs differ'; echo; echo '```diff'; cat shadow.diff; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Merge green updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./tools/auto-merge.sh
