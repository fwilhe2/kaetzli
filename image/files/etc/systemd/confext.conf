# /etc is writable, as an overlay: the image's /etc underneath, writes in
# /var/lib/extensions.mutable/etc, so on a VM's /var disk they are kept, and in RAM with
# /var otherwise. This is systemd-confext's mutable mode (systemd-sysext(8),
# "Mutability"), with or without a confext merged: `auto` turns it on only where that
# directory exists, which systemd-confext.service.d/50-mutable-etc.conf makes, and never
# under Secure Boot, where /var/lib/extensions.mutable is an empty read-only mount
# (image/build-rootfs.sh): /var is a disk nothing verifies, and an /etc from it could
# start anything (docs/guides/secure-boot.md).
#
# A file nobody wrote follows the image: a new snapshot's /etc shows through. One that was
# written stays as written, over whatever a newer image ships there.
[ConfExt]
Mutable=auto
