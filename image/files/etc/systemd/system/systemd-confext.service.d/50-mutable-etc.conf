# Merge at every boot, not only when a confext is installed: with confext.conf's
# Mutable=auto this is what makes /etc writable. Upstream's conditions are all triggering
# (|), so this one is added to them: true whenever Secure Boot is off. Under Secure Boot
# only a verified confext starts it, and the mkdir fails on the read-only mount over
# /var/lib/extensions.mutable, which keeps /etc read-only.
[Unit]
ConditionSecurity=|!uefi-secureboot

[Service]
ExecStartPre=-/usr/bin/mkdir -p /var/lib/extensions.mutable/etc
