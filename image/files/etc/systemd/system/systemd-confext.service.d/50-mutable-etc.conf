# Merge at every boot, not only when a confext is installed: with confext.conf's
# Mutable=auto this is what makes /etc writable. Upstream's conditions are all triggering
# (|), so this one is added to them: true whenever Secure Boot is off. Under Secure Boot
# only a verified confext starts it, and the mkdir fails on the read-only mount over
# /var/lib/extensions.mutable, which keeps /etc read-only.
#
# The merge reloads PID 1, but the boot's transaction was made before it, from the
# image's /etc: a unit enabled into the upper layer on an earlier boot (node-agent's,
# kubelet) is loaded and enabled, and never started. Starting each target the boot still
# has a start job for again adds what the merged /etc's .wants name, and nothing else
# (test/gardener.py's second boot).
[Unit]
ConditionSecurity=|!uefi-secureboot

[Service]
ExecStartPre=-/usr/bin/mkdir -p /var/lib/extensions.mutable/etc
ExecStartPost=-/usr/bin/bash -c "systemctl list-jobs --no-legend --plain | awk '$$3 == \"start\" && $$2 ~ /[.]target$$/ {print $$2}' | xargs -r systemctl --no-block start"
