# /opt/bin is a symlink to var/opt/bin (image/build-rootfs.sh): the one writable place
# under /opt, for binaries a node agent installs at boot (Gardener's gardener-node-agent
# and kubelet). In RAM with /var, or kept on the VM's /var disk.
d /var/opt     0755 root root -
d /var/opt/bin 0755 root root -
